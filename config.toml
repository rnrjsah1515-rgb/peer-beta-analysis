# 유사기업 베타 분석 설정
# 모든 판단(측정 기간·주기·지수·세율·부채 정의)을 여기서 바꾸고 run.py 를 다시 실행하면 결과가 갱신된다.

[case]
target_name = "가상 화장품 ODM (비상장)"
valuation_date = "2026-09-18"   # 평가기준일 (금요일, 주간 수익률 기준점)

[measurement]
# 기본 측정 조건: 주간 수익률(금요일 종가) 2년 = 104주
base = "weekly_2y"
# 채택 시장지수. 원칙은 KOSPI(ERP 와 같은 시장)지만, 평가기준일 현재 반도체 3종목이 KOSPI 시가총액의 53% 를 차지해
# 화장품주의 시장 포트폴리오 대용치로 부적합하다고 판단 → 반도체 제외 KOSPI 채택. KOSPI 는 하한, KOSDAQ 은 상한으로 병기.
market_index = "EX_SEMIS"       # KOSPI / EX_SEMIS / LISTED / KOSDAQ
principle_index = "KOSPI"       # 비교 기준(원칙)
min_obs_ratio = 0.8             # 관측치가 목표의 80% 미만이면 경고

# 측정 조건별 민감도 (label = [주기, 관측치 수])
[measurement.alternatives]
daily_1y   = ["D", 250]
weekly_2y  = ["W", 104]
weekly_3y  = ["W", 156]
monthly_5y = ["M", 60]

[peers]
# 종목코드 = [회사명, 상장시장]
"192820" = ["코스맥스", "KOSPI"]
"161890" = ["한국콜마", "KOSPI"]
"241710" = ["코스메카코리아", "KOSDAQ"]
"352480" = ["씨앤씨인터내셔널", "KOSDAQ"]
"950140" = ["잉글우드랩", "KOSDAQ"]
"003350" = ["한국화장품제조", "KOSPI"]

[capital]
include_lease = true            # IFRS 16 리스부채를 부채에 포함 (FCFF 에서 리스료를 영업비용으로 보지 않는 것과 일관)
debt_basis = "gross"            # gross: 총차입금 / net: 순차입금(현금 차감, 음수면 0)
tax_rate = 0.275                # 한계세율 (법인세 최고세율 25% + 지방소득세 2.5%, 2026년 개시 사업연도)

# 자기자본비용 환산용 (베타 구간이 Ke 에 주는 영향을 보여주기 위한 예시 가정. 이 프로젝트의 산출물은 베타까지다)
[cost_of_equity]
risk_free = 0.03
erp = 0.07

# 재무상태표 본문에 차입금이 구분 표시되지 않은 회사: 주석에서 확인한 이자부부채 (억원)
[capital.overrides."192820"]
borrowings = 10261.8            # 차입금 9,847.0 (주석17: 단기 6,241.1 + 유동성장기 584.4 + 장기 3,021.4) + 사채 414.9 (주석18)
lease = 612.3                   # 주석16 리스부채 (유동 195.2 + 비유동 417.1)
source = "코스맥스 2026 반기보고서 연결 주석 16~18 — 본문 금융부채 12,723억 중 미지급금·임대보증금 1,849억 제외"
